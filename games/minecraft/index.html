<!DOCTYPE html>
<html lang="en">
<head>

    <title>WebAssembly Support</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --surface: #1a1a1a;
            --primary: #00ff88;
            --secondary: #ff3c5f;
            --text: #ffffff;
            --text-secondary: #a0a0a0;
            --glass: rgba(255, 255, 255, 0.05);
            --radius-lg: 24px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1rem;
            line-height: 1.6;
        }

        .container {
            background: var(--surface);
            backdrop-filter: blur(12px);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            max-width: 680px;
            width: 100%;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass);
            transform: translateY(20px);
            opacity: 0;
            animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(45deg, var(--primary), #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
        }

        p { color: var(--text-secondary); margin-bottom: 2rem; }

        .buttons { display: grid; gap: 1rem; margin-top: 2rem; }

        .btn {
            padding: 1rem 2rem;
            font-weight: 600;
            border-radius: var(--radius-md);
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: currentColor;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .btn:hover::before { opacity: 0.1; }

        .btn--primary { background: var(--primary); color: var(--bg); }
        .btn--secondary { background: none; color: var(--text-secondary); border: 1px solid var(--glass); }
        .btn--secondary:hover { color: var(--text); border-color: var(--text-secondary); }

        .progress {
            height: 4px;
            background: var(--glass);
            border-radius: var(--radius-sm);
            overflow: hidden;
            margin: 2rem 0;
        }

        .progress__bar {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 1s linear;
            position: relative;
        }

        .progress__bar::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 20px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2));
        }

        .timer-text {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 1rem;
        }

        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 640px) {
            .container { padding: 1.5rem; }
            h1 { font-size: 1.75rem; }
            .btn { padding: 0.875rem 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 WebAssembly GC Enabled</h1>
        <p>Experience EaglercraftX 1.12.2 with 2x performance using our new WebAssembly engine. Existing singleplayer worlds will be preserved.</p>
        <p class="text-secondary">Note: Requires sufficient device memory for optimal performance.</p>

        <div class="progress">
            <div class="progress__bar"></div>
        </div>
        <div class="timer-text">Auto-redirect in 20 seconds...</div>

        <div class="buttons">
            <button id="btn-js" class="btn btn--secondary">
                Continue with JavaScript
            </button>
            <button id="btn-wasm" class="btn btn--primary">
                Launch WebAssembly Version
            </button>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            let timerInterval;
            const TIMER_DURATION = 20;

            function loadPage(url) {
                if (timerInterval) clearInterval(timerInterval);
                
                const container = document.querySelector('.container');
                if (container) container.style.opacity = '0.5';

                fetch(url)
                    .then(response => {
                        if (!response.ok) throw new Error('Network response was not ok');
                        return response.text();
                    })
                    .then(content => {
                        document.body.innerHTML = '';
                        document.open();
                        document.write(content);
                        document.close();
                    })
                    .catch(error => {
                        console.error('Loader error:', error);
                        if(container) {
                            container.style.opacity = '1';
                            alert("Failed to load: " + url);
                        }
                    });
            }

            function startTimer() {
                const progressBar = document.querySelector('.progress__bar');
                const timerText = document.querySelector('.timer-text');
                
                if (!progressBar || !timerText) return;

                let timeLeft = TIMER_DURATION;
                
                progressBar.style.width = '0%';
                
                timerInterval = setInterval(() => {
                    timeLeft--;
                    const progress = ((TIMER_DURATION - timeLeft) / TIMER_DURATION) * 100;
                    
                    if (progressBar) progressBar.style.width = `${progress}%`;
                    if (timerText) timerText.textContent = `Auto-redirect in ${timeLeft} seconds...`;

                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        loadPage('wasm.html');
                    }
                }, 1000);
            }

            function init() {
                // Feature detection
                const hasWasm = typeof WebAssembly !== "undefined" && typeof WebAssembly.Suspending !== "undefined";

                if (!hasWasm) {
                    // Immediate redirect if unsupported
                    loadPage('play.html');
                    return;
                }

                // Attach listeners
                const btnJs = document.getElementById('btn-js');
                const btnWasm = document.getElementById('btn-wasm');

                if (btnJs) {
                    btnJs.addEventListener('click', (e) => {
                        e.preventDefault();
                        loadPage('play.html');
                    });
                }

                if (btnWasm) {
                    btnWasm.addEventListener('click', (e) => {
                        e.preventDefault();
                        loadPage('wasm.html');
                    });
                }

                startTimer();
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
